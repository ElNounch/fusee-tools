name: Cross build
on:
  push:
#    branches: [ "master" ]
  pull_request:
#    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: tecolicom/actions-use-apt-tools@v1.6
      with:
        tools: libgnutls28-dev
    - uses: carlosperate/arm-none-eabi-gcc-action@v1.10.0
      with:
        path-env-var: ARM_NONE_EABI_GCC_PATH
    - name: Set CROSS_COMPILE environment variable
      run: echo "CROSS_COMPILE=$(echo "$ARM_NONE_EABI_GCC_PATH/arm-none-eabi-")" >> $GITHUB_ENV
    - name: pwd
      run: pwd
    - name: Build
      run: |
        cd payloads
        make
        pwd
    - name: pwd
      run: pwd
    - name: Archive production artifacts
      uses: actions/upload-artifact@v4
      with:
          name: payloads
          path: payloads/**.bin
